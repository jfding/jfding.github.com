  .model-freq {

  .model-cn-desc { font-size: 12.5px; margin-top: 2px; line-height: 1.5; }

  // Filters
  document.getElementById("filters").innerHTML = [0,1,2,3].map(f =>
    `<button class="${filter===f?'active':''}" onclick="setFilter(${f})">${
      f===0 ? 'All 全部' : freqLabel[f]
    }</button>`
  ).join("");

  const content = document.getElementById("content");

  // Total counts for the grid view
  const totalAll = data.reduce((s,c) => s + (filter===0 ? c.models.length : c.models.filter(m=>m.f===filter).length), 0);

  if (sel === null) {
    // --- Grid ---
    content.innerHTML = `
      <div style="margin-bottom:10px;font-size:13px;color:#888;">${totalAll} models across ${data.length} categories</div>
      <div class="grid">
        ${data.map((c,i) => {
          let count = filter===0 ? c.models.length : c.models.filter(m=>m.f===filter).length;
          if (count===0) return "";
          return `<div class="card" style="background:${c.bg};border-left:3px solid ${c.color}" onclick="selectCat(${i})">
            <div class="cat-name" style="color:${c.color}">${c.cat}</div>
            <div class="count" style="color:#777">${count} models</div>
          </div>`;
        }).join("")}
      </div>`;
  } else {
    // --- Detail ---
    const c = data[sel];
    const models = c.models.filter(m => filter===0 || m.f===filter);
    content.innerHTML = `
      <button class="back-btn" onclick="selectCat(null)">← Back to all categories 返回所有分类</button>
      <div class="detail-header" style="color:${c.color};border-bottom-color:${c.color}">${c.cat}</div>
      <div class="model-list">
        ${models.map(m => `
          <div class="model-card" style="background:${c.bg};border-left:3px solid ${freqColor[m.f]}">
            <div class="model-top">
              <span class="model-name">${m.n}</span>
              <span class="model-freq" style="background:${freqBg[m.f]};color:${freqColor[m.f]}">${freqLabel[m.f]}</span>
            </div>
            <div class="model-cn" style="color:${c.color}">${m.cn}</div>
            <div class="model-en" style="color:#555">${m.d}</div>
            <div class="model-cn-desc" style="color:#888">${m.dc}</div>
          </div>
        `).join("")}
      </div>`;
  }
}

function setFilter(f) { filter = f; render(); }
function selectCat(i) { sel = i; render(); }

render();
</script>

</body>
</html>
